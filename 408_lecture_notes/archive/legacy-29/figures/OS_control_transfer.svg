<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390">
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="#333"/></marker></defs>
<rect width="960" height="390" fill="white"/>
<text x="480.0" y="31" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" fill="#111">系统调用入口与返回：模式改变不必更换进程</text>
<rect x="30" y="80" width="230" height="65" rx="4" fill="#f2f3f4" stroke="#333" stroke-width="2"/>
<text x="145.0" y="119.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">用户程序：准备参数</text>
<rect x="365" y="80" width="230" height="65" rx="4" fill="#f2f3f4" stroke="#333" stroke-width="2"/>
<text x="480.0" y="119.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">执行陷入指令</text>
<rect x="700" y="80" width="230" height="65" rx="4" fill="#f2f3f4" stroke="#333" stroke-width="2"/>
<text x="815.0" y="105.8" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">硬件保存必要状态</text>
<text x="815.0" y="131.8" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">转入受控内核入口</text>
<line x1="260" y1="112" x2="365" y2="112" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="595" y1="112" x2="700" y2="112" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<rect x="700" y="245" width="230" height="65" rx="4" fill="#f2f3f4" stroke="#333" stroke-width="2"/>
<text x="815.0" y="270.8" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">入口代码保存现场</text>
<text x="815.0" y="296.8" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">执行服务例程</text>
<rect x="365" y="245" width="230" height="65" rx="4" fill="#f2f3f4" stroke="#333" stroke-width="2"/>
<text x="480.0" y="270.8" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">恢复现场</text>
<text x="480.0" y="296.8" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">执行异常返回</text>
<rect x="30" y="245" width="230" height="65" rx="4" fill="#f2f3f4" stroke="#333" stroke-width="2"/>
<text x="145.0" y="284.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">用户程序继续执行</text>
<line x1="815" y1="145" x2="815" y2="245" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="825" y="195" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">内核态</text>
<line x1="700" y1="277" x2="595" y2="277" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<line x1="365" y1="277" x2="260" y2="277" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="364" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">可在同一进程内完成；阻塞或调度时才可能转交其他执行者</text>
</svg>