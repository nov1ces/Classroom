<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500" y="30" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#111">DMA输入：CPU设置和收尾，控制器组织传送</text>
<rect x="25" y="80" width="200" height="75" fill="#e9f0f3" stroke="#333" stroke-width="2"/>
<text x="125.0" y="124.85" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">CPU / 驱动</text>
<rect x="345" y="80" width="260" height="75" fill="#e9f0f3" stroke="#333" stroke-width="2"/>
<text x="475.0" y="124.85" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">DMA控制器</text>
<rect x="760" y="80" width="215" height="75" fill="#e9f0f3" stroke="#333" stroke-width="2"/>
<text x="867.5" y="124.85" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">主存</text>
<rect x="345" y="255" width="260" height="75" fill="#e9f0f3" stroke="#333" stroke-width="2"/>
<text x="475.0" y="299.85" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">设备接口</text>
<rect x="25" y="255" width="200" height="75" fill="#e9f0f3" stroke="#333" stroke-width="2"/>
<text x="125.0" y="299.85" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">外部设备</text>
<line x1="225" y1="105" x2="345" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="285" y="85" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#111">设置</text>
<line x1="345" y1="140" x2="225" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="285" y="183" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#111">完成中断</text>
<line x1="475" y1="255" x2="475" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="565" y="218" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#111">请求/控制</text>
<line x1="225" y1="292" x2="345" y2="292" stroke="#333" stroke-width="2"/>
<path d="M605,292 L865,292 L865,155" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760" y="340" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#111">输入数据：接口 → 主存</text>
<text x="500" y="385" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">CPU不逐字搬运；DMA仍占用相应总线和存储资源</text>
</svg>