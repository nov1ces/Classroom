<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#466c82"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC,sans-serif" font-size="23" fill="#20343f">
<text x="25" y="38" font-size="26">无符号恢复余数除法：0000 1111 ÷ 0010（15 ÷ 2）</text>
<rect x="25" y="64" width="405" height="56" rx="6" fill="#DDEFF5" stroke="#7c9aa9"/>
<text x="41" y="100.0" font-size="23">初态 R=0000，Q=1111</text>
<rect x="542" y="64" width="410" height="56" rx="6" fill="#DDEFF5" stroke="#7c9aa9"/>
<text x="558" y="100.0" font-size="23">除数 Y=0010；计数 Cn=4</text>
<text x="25" y="160" font-size="23">每轮：RQ整体左移 → 试减Y → 结果非负保留；负则恢复R → 写商位</text>
<text x="25" y="220" font-size="23">第1轮</text>
<rect x="130" y="190" width="275" height="56" rx="6" fill="#DDEFF5" stroke="#7c9aa9"/>
<text x="146" y="226.0" font-size="23">移位后 R=0001 Q=1110</text>
<rect x="441" y="190" width="180" height="56" rx="6" fill="#FFF1D3" stroke="#7c9aa9"/>
<text x="457" y="226.0" font-size="23">−1，恢复</text>
<rect x="657" y="190" width="295" height="56" rx="6" fill="#DFEFE6" stroke="#7c9aa9"/>
<text x="673" y="226.0" font-size="23">轮末 R=0001 Q=1110</text>
<path d="M405 218 H435 M621 218 H651" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="302" font-size="23">第2轮</text>
<rect x="130" y="272" width="275" height="56" rx="6" fill="#DDEFF5" stroke="#7c9aa9"/>
<text x="146" y="308.0" font-size="23">移位后 R=0011 Q=1100</text>
<rect x="441" y="272" width="180" height="56" rx="6" fill="#FFF1D3" stroke="#7c9aa9"/>
<text x="457" y="308.0" font-size="23">1，保留</text>
<rect x="657" y="272" width="295" height="56" rx="6" fill="#DFEFE6" stroke="#7c9aa9"/>
<text x="673" y="308.0" font-size="23">轮末 R=0001 Q=1101</text>
<path d="M405 300 H435 M621 300 H651" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="384" font-size="23">第3轮</text>
<rect x="130" y="354" width="275" height="56" rx="6" fill="#DDEFF5" stroke="#7c9aa9"/>
<text x="146" y="390.0" font-size="23">移位后 R=0011 Q=1010</text>
<rect x="441" y="354" width="180" height="56" rx="6" fill="#FFF1D3" stroke="#7c9aa9"/>
<text x="457" y="390.0" font-size="23">1，保留</text>
<rect x="657" y="354" width="295" height="56" rx="6" fill="#DFEFE6" stroke="#7c9aa9"/>
<text x="673" y="390.0" font-size="23">轮末 R=0001 Q=1011</text>
<path d="M405 382 H435 M621 382 H651" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="466" font-size="23">第4轮</text>
<rect x="130" y="436" width="275" height="56" rx="6" fill="#DDEFF5" stroke="#7c9aa9"/>
<text x="146" y="472.0" font-size="23">移位后 R=0011 Q=0110</text>
<rect x="441" y="436" width="180" height="56" rx="6" fill="#FFF1D3" stroke="#7c9aa9"/>
<text x="457" y="472.0" font-size="23">1，保留</text>
<rect x="657" y="436" width="295" height="56" rx="6" fill="#DFEFE6" stroke="#7c9aa9"/>
<text x="673" y="472.0" font-size="23">轮末 R=0001 Q=0111</text>
<path d="M405 464 H435 M621 464 H651" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="565" font-size="23">终态：R=0001（余数1），Q=0111（商7），Cn=0</text>
<text x="25" y="607" font-size="23">回代：15 = 7 × 2 + 1，且 0 ≤ 1 &lt; 2</text>
</g></svg>