<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#466C82" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" fill="#263945">
<text x="450.0" y="30" text-anchor="middle" font-size="23" fill="#263945">
<tspan x="450.0" dy="0">DMA块传送的预处理、硬件搬运与后处理</tspan>
</text>
<rect x="20" y="75" width="245" height="115" rx="7" fill="#DFEFE6" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="142.5" y="112.88" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="142.5" dy="0">CPU预处理</tspan>
<tspan x="142.5" dy="26.099999999999998">方向、起始地址、字数</tspan>
<tspan x="142.5" dy="26.099999999999998">启动设备</tspan>
</text>
<rect x="335" y="75" width="245" height="115" rx="7" fill="#DDEFF5" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="457.5" y="112.88" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="457.5" dy="0">DMA硬件传送</tspan>
<tspan x="457.5" dy="26.099999999999998">申请总线 → 搬运数据</tspan>
<tspan x="457.5" dy="26.099999999999998">地址更新、计数减1</tspan>
</text>
<rect x="650" y="75" width="230" height="115" rx="7" fill="#DFEFE6" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="765.0" y="112.88" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="765.0" dy="0">CPU后处理</tspan>
<tspan x="765.0" dy="26.099999999999998">检查状态、处理错误</tspan>
<tspan x="765.0" dy="26.099999999999998">组织后续操作</tspan>
</text>
<path d="M265,132 L335,132" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580,132 L650,132" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="615.0" y="123.0" text-anchor="middle" font-size="16" fill="#263945">
<tspan x="615.0" dy="0">完成中断</tspan>
</text>
<rect x="290" y="280" width="140" height="60" rx="7" fill="#DDEFF5" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="360.0" y="316.3" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="360.0" dy="0">I/O设备</tspan>
</text>
<rect x="570" y="280" width="140" height="60" rx="7" fill="#DDEFF5" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="640.0" y="316.3" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="640.0" dy="0">主存</tspan>
</text>
<path d="M430,310 L570,310" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500.0" y="301.0" text-anchor="middle" font-size="16" fill="#263945">
<tspan x="500.0" dy="0">DMA直接数据通路</tspan>
</text>
<path d="M458,190 L458,280" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="472" y="241.0" text-anchor="start" font-size="16" fill="#263945">
<tspan x="472" dy="0">控制</tspan>
</text>
<text x="450" y="365" text-anchor="middle" font-size="19" fill="#263945">
<tspan x="450" dy="0">CPU负责设置与收尾，数据块逐字传送由DMA控制</tspan>
</text>
</g></svg>