<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#466C82"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6" fill="none" stroke="#466C82"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#223C49"><text x="20" y="30" font-size="18">双链表：p之后插入s，旧后继为q</text><text x="20" y="82" font-size="18">插入前</text><rect x="155" y="58" width="85" height="42" rx="4" fill="#DDEFF5" stroke="#7D9BAA"/><text x="164" y="85.0" font-size="18">p</text><rect x="410" y="58" width="85" height="42" rx="4" fill="#DDEFF5" stroke="#7D9BAA"/><text x="419" y="85.0" font-size="18">q</text><path d="M240,79 L410,79" fill="none" stroke="#466C82" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#b)"/><text x="20" y="172" font-size="18">插入后</text><rect x="155" y="146" width="85" height="42" rx="4" fill="#DDEFF5" stroke="#7D9BAA"/><text x="164" y="173.0" font-size="18">p</text><rect x="285" y="146" width="85" height="42" rx="4" fill="#F6E4EB" stroke="#7D9BAA"/><text x="294" y="173.0" font-size="18">s</text><rect x="410" y="146" width="85" height="42" rx="4" fill="#DDEFF5" stroke="#7D9BAA"/><text x="419" y="173.0" font-size="18">q</text><path d="M240,167 L285,167" fill="none" stroke="#466C82" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#b)"/><path d="M370,167 L410,167" fill="none" stroke="#466C82" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#b)"/><text x="20" y="235" font-size="17">s-&gt;next=q；q-&gt;prior=s；s-&gt;prior=p；p-&gt;next=s</text><text x="20" y="295" font-size="18">循环单链表空表：L-&gt;next=L</text><rect x="420" y="265" width="110" height="42" rx="4" fill="#DDEFF5" stroke="#7D9BAA"/><text x="429" y="292.0" font-size="18">头结点</text><path d="M530,286 H605 V330 H475 V307" fill="