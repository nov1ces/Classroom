" y="557" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#243947">私有就绪队列</text><text x="1030" y="592" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#243947">P4 → P8 → P12</text><text x="32" y="663" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#243947">P16 从 CPU4 队尾移出，插入 CPU1 队尾。</text><text x="30" y="744" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#243947">Push：特定系统程序周期检查负载，把忙CPU就绪进程推向较空闲CPU。</text><text x="30" y="780" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#243947">Pull：CPU调度程序发现本核负载低时，从忙CPU队列拉取就绪进程。</text><text x="30" y="816" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#243947">两者的发起方不同，可在同一系统按实现需要共同使用。</text></svg>