<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#547f96"/></marker></defs>
<rect width="1120" height="480" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#294958">
<text x="190" y="35" text-anchor="middle" font-size="23">绝对装入</text>
<rect x="35" y="55" width="310" height="70" rx="5" fill="#deedf5" stroke="#8da8b6"/>
<text x="190.0" y="97.0" text-anchor="middle" font-size="21">编译时知道装入位置</text>
<rect x="35" y="175" width="310" height="70" rx="5" fill="#dfefe4" stroke="#8da8b6"/>
<text x="190.0" y="217.0" text-anchor="middle" font-size="21">指令中已写物理地址179</text>
<rect x="35" y="295" width="310" height="75" rx="5" fill="#fff1ce" stroke="#8da8b6"/>
<text x="190.0" y="339.5" text-anchor="middle" font-size="21">直接访问物理地址179</text>
<path d="M190,125 L190,175" stroke="#547f96" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M190,245 L190,295" stroke="#547f96" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="560" y="35" text-anchor="middle" font-size="23">可重定位装入</text>
<rect x="405" y="55" width="310" height="70" rx="5" fill="#deedf5" stroke="#8da8b6"/>
<text x="560.0" y="97.0" text-anchor="middle" font-size="21">装入前指令地址为79</text>
<rect x="405" y="175" width="310" height="70" rx="5" fill="#dfefe4" stroke="#8da8b6"/>
<text x="560.0" y="217.0" text-anchor="middle" font-size="21">装入时把地址改为179</text>
<rect x="405" y="295" width="310" height="75" rx="5" fill="#fff1ce" stroke="#8da8b6"/>
<text x="560.0" y="339.5" text-anchor="middle" font-size="21">运行时直接访问物理179</text>
<path d="M560,125 L560,175" stroke="#547f96" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M560,245 L560,295" stroke="#547f96" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="930" y="35" text-anchor="middle" font-size="23">动态运行时装入</text>
<rect x="775" y="55" width="310" height="70" rx="5" fill="#deedf5" stroke="#8da8b6"/>
<text x="930.0" y="97.0" text-anchor="middle" font-size="21">装入前指令地址为79</text>
<rect x="775" y="175" width="310" height="70" rx="5" fill="#dfefe4" stroke="#8da8b6"/>
<text x="930.0" y="217.0" text-anchor="middle" font-size="21">装入后指令仍保持79</text>
<rect x="775" y="295" width="310" height="75" rx="5" fill="#fff1ce" stroke="#8da8b6"/>
<text x="930.0" y="339.5" text-anchor="middle" font-size="21">运行访存时 79＋100＝179</text>
<path d="M930,125 L930,175" stroke="#547f96" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M930,245 L930,295" stroke="#547f96" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="560" y="435" text-anchor="middle" font-size="21">同一示例：起始物理地址100，变量在逻辑地址79</text>
</g></svg>