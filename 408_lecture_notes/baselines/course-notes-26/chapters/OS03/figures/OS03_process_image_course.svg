<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600">
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#547f96"/></marker></defs>
<rect width="1120" height="600" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#294958">
<text x="560" y="35" text-anchor="middle" font-size="23">32位进程虚拟映像（课件示意，具体布局随平台变化）</text>
<text x="85" y="90" text-anchor="start" font-size="20">0xFFFFFFFF</text>
<text x="85" y="190" text-anchor="start" font-size="20">0xC0000000</text>
<text x="85" y="347" text-anchor="start" font-size="20">0x40000000</text>
<text x="85" y="532" text-anchor="start" font-size="20">0x08048000</text>
<text x="85" y="565" text-anchor="start" font-size="20">0x00000000</text>
<rect x="250" y="65" width="330" height="110" rx="5" fill="#deedf5" stroke="#8da8b6"/>
<text x="415.0" y="113.5" text-anchor="middle" font-size="21">内核区：1 GiB</text>
<text x="415.0" y="140.5" text-anchor="middle" font-size="21">内核代码、数据与PCB</text>
<rect x="250" y="175" width="330" height="90" rx="5" fill="#f6e5ec" stroke="#8da8b6"/>
<text x="415.0" y="213.5" text-anchor="middle" font-size="21">用户栈</text>
<text x="415.0" y="240.5" text-anchor="middle" font-size="21">局部变量、调用参数</text>
<rect x="250" y="265" width="330" height="75" rx="5" fill="#fff1ce" stroke="#8da8b6"/>
<text x="415.0" y="296.0" text-anchor="middle" font-size="21">共享库映射区</text>
<text x="415.0" y="323.0" text-anchor="middle" font-size="21">例如 printf 代码</text>
<rect x="250" y="340" width="330" height="75" rx="5" fill="#dfefe4" stroke="#8da8b6"/>
<text x="415.0" y="371.0" text-anchor="middle" font-size="21">堆</text>
<text x="415.0" y="398.0" text-anchor="middle" font-size="21">malloc分配的数据</text>
<rect x="250" y="415" width="330" height="55" rx="5" fill="#deedf5" stroke="#8da8b6"/>
<text x="415.0" y="449.5" text-anchor="middle" font-size="21">读写数据：全局／静态变量</text>
<rect x="250" y="470" width="330" height="55" rx="5" fill="#f6e5ec" stroke="#8da8b6"/>
<text x="415.0" y="504.5" text-anchor="middle" font-size="21">只读代码／数据</text>
<rect x="250" y="525" width="330" height="35" rx="5" fill="#fff1ce" stroke="#8da8b6"/>
<text x="415.0" y="549.5" text-anchor="middle" font-size="18">低地址未使用区</text>
<text x="650" y="135" text-anchor="start" font-size="21">用户区与内核区通过地址边界区分</text>
<text x="650" y="200" text-anchor="start" font-size="21">栈保存函数的运行现场与局部对象</text>
<text x="650" y="265" text-anchor="start" font-size="21">库函数代码属于共享库映射区域</text>
<text x="650" y="330" text-anchor="start" font-size="21">指针变量与它指向的堆对象须分开判断</text>
<text x="650" y="395" text-anchor="start" font-size="21">全局及 static 变量属于静态存储期</text>
<text x="650" y="460" text-anchor="start" font-size="21">宏在预处理阶段替换，不单独分配对象</text>
</g></svg>