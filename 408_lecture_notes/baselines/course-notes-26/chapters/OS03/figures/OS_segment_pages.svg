<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#47677b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" fill="#223644" font-size="20">
<text x="480" y="35" text-anchor="middle" font-size="23" font-weight="bold">每个逻辑段独立分页：页大小4 KiB</text>
<rect x="35" y="80" width="270" height="60" rx="6" stroke="#809eae" fill="#e4eff3"/>
<text x="170.0" y="117.0" text-anchor="middle" font-size="20">MAIN段：7 KiB</text>
<rect x="35" y="205" width="270" height="75" rx="6" stroke="#809eae" fill="#e0efdf"/>
<text x="170.0" y="237.0" text-anchor="middle" font-size="20">2页，共8 KiB</text>
<text x="170.0" y="262.0" text-anchor="middle" font-size="20">末页空余1 KiB</text>
<path d="M170,140 L170,205" fill="none" stroke="#47677b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="345" y="80" width="270" height="60" rx="6" stroke="#809eae" fill="#e4eff3"/>
<text x="480.0" y="117.0" text-anchor="middle" font-size="20">X段：3 KiB</text>
<rect x="345" y="205" width="270" height="75" rx="6" stroke="#809eae" fill="#e0efdf"/>
<text x="480.0" y="237.0" text-anchor="middle" font-size="20">1页，共4 KiB</text>
<text x="480.0" y="262.0" text-anchor="middle" font-size="20">末页空余1 KiB</text>
<path d="M480,140 L480,205" fill="none" stroke="#47677b" stroke-width="2" marker-end="url(#arr)"/>
<rect x="655" y="80" width="270" height="60" rx="6" stroke="#809eae" fill="#e4eff3"/>
<text x="790.0" y="117.0" text-anchor="middle" font-size="20">D段：6 KiB</text>
<rect x="655" y="205" width="270" height="75" rx="6" stroke="#809eae" fill="#e0efdf"/>
<text x="790.0" y="237.0" text-anchor="middle" font-size="20">2页，共8 KiB</text>
<text x="790.0" y="262.0" text-anchor="middle" font-size="20">末页空余2 KiB</text>
<path d="M790,140 L790,205" fill="none" stroke="#47677b" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="335" text-anchor="middle" font-size="21">总驻留页框5个，占20 KiB，内部未用空间共4 KiB。</text>
<text x="480" y="385" text-anchor="middle" font-size="20">段号 → 段表 → 该段页表 → 页框；段号与段内页号分别检查。</text>
</g></svg>