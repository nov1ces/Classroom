<text x="40" y="318" font-size="19">CPU在3–5等待输入；复制结束后系统缓冲区才可重新填入。</text>
<text x="40" y="370" font-size="22" font-weight="bold">T &lt; C：示意取 T=3，C=5，M=1；周期 C+M=6</text>
