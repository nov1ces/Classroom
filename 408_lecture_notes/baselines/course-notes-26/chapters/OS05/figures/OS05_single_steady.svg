<text x="621.0" y="516" text-anchor="middle" font-size="18">C</text>
<rect x="782" y="493" width="230" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
<text x="897.0" y="516" text-anchor="middle" font-size="18">C</text>
<line x1="230" y1="540" x2="230" y2="548" stroke="#536f7e"/>
<text x="230" y="571" text-anchor="middle" font-size="20">0</text>
<line x1="506" y1="540" x2="506" y2="548" stroke="#536f7e"/>
