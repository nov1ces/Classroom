<text x="851.0" y="231" text-anchor="middle" font-size="18">C</text>
<line x1="230" y1="255" x2="230" y2="263" stroke="#536f7e"/>
<text x="230" y="286" text-anchor="middle" font-size="20">0</text>
<line x1="506" y1="255" x2="506" y2="263" stroke="#536f7e"/>
<text x="506" y="286" text-anchor="middle" font-size="20">6</text>
<line x1="782" y1="255" x2="782" y2="263" stroke="#536f7e"/>
<text x="782" y="286" text-anchor="middle" font-size="20">12</text>
