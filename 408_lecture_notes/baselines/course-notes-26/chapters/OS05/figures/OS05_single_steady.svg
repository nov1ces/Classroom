<text x="1035.0" y="181" text-anchor="middle" font-size="18">M</text>
<text x="215" y="233" text-anchor="end" font-size="20">CPU处理工作区</text>
<line x1="230" y1="240" x2="1058" y2="240" stroke="#aab6bf" stroke-width="1"/>
<rect x="230" y="208" width="138" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
