<text x="759.0" y="466" text-anchor="middle" font-size="18">M</text>
<rect x="1012" y="443" width="46" height="32" rx="3" fill="#dcefe4" stroke="#536f7e"/>
<text x="1035.0" y="466" text-anchor="middle" font-size="18">M</text>
<text x="215" y="518" text-anchor="end" font-size="20">CPU处理工作区</text>
<line x1="230" y1="525" x2="1058" y2="525" stroke="#aab6bf" stroke-width="1"/>
<rect x="230" y="493" width="230" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
