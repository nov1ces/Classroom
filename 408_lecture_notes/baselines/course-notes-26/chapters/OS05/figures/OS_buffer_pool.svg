<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#47677b"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" fill="#223644" font-size="20">
<text x="480" y="32" text-anchor="middle" font-size="23" font-weight="bold">缓冲池：三队列与四种工作角色</text>
<rect x="350" y="65" width="260" height="55" rx="6" stroke="#809eae" fill="#e0efdf"/>
<text x="480.0" y="99.5" text-anchor="middle" font-size="20">空缓冲队列</text>
<rect x="40" y="220" width="250" height="60" rx="6" stroke="#809eae" fill="#e4eff3"/>
<text x="165.0" y="257.0" text-anchor="middle" font-size="20">输入满队列</text>
<rect x="670" y="220" width="250" height="60" rx="6" stroke="#809eae" fill="#f5ead9"/>
<text x="795.0" y="257.0" text-anchor="middle" font-size="20">输出满队列</text>
<path d="M350,92 L165,220" fill="none" stroke="#47677b" stroke-width="2" marker-end="url(#arr)"/>
<text x="262.5" y="148.0" text-anchor="middle" font-size="17">取得hin并冲满</text>
<path d="M165,280 C165,380 440,400 350,118" fill="none" stroke="#47677b" stroke-width="2" marker-end="url(#arr)"/>
<text x="262.5" y="191.0" text-anchor="middle" font-size="17">取得sin并读空</text>
<path d="M610,92 L795,220" fill="none" stroke="#47677b" stroke-width="2" marker-end="url(#arr)"/>
<text x="707.5" y="148.0" text-anchor="middle" font-size="17">取得hout并冲满</text>
<path d="M795,280 C795,380 520,400 610,118" fill="none" stroke="#47677b" stroke-width="2" marker-end="url(#arr)"/>
<text x="707.5" y="191.0" text-anchor="middle" font-size="17">取得sout并读空</text>
<text x="480" y="405" text-anchor="middle" font-size="19">hin/sin用于输入；hout/sout用于输出；每次转移都维护队列与独占使用权。</text>
</g></svg>