<text x="810" y="78" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">H2</text>
<line x1="810" y1="95" x2="810" y2="330" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="130" y1="108" x2="470" y2="164" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="122" text-anchor="middle" font-size="19" font-weight="normal" fill="#17212a">分组1</text>
<line x1="470" y1="164" x2="810" y2="220" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="178" text-anchor="middle" font-size="19" font-weight="normal" fill="#17212a">分组1</text>
<line x1="130" y1="164" x2="470" y2="220" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="178" text-anchor="middle" font-size="19" font-weight="normal" fill="#17212a">分组2</text>
<line x1="470" y1="220" x2="810" y2="276" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="234" text-anchor="middle" font-size="19" font-weight="normal" fill="#17212a">分组2</text>
<line x1="130" y1="220" x2="470" y2="276" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="234" text-anchor="middle" font-size="19" font-weight="normal" fill="#17212a">分组3</text>
<line x1="470" y1="276" x2="810" y2="332" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
