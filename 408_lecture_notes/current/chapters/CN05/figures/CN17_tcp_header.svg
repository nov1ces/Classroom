<text x="967" y="502" text-anchor="middle" font-size="18" font-weight="normal" fill="#17212a">0～3 B</text>
<text x="137" y="475" text-anchor="end" font-size="17" font-weight="normal" fill="#17212a">20 B起</text>
<text x="603" y="552" text-anchor="middle" font-size="18" font-weight="normal" fill="#17212a">可变区压缩示意；虚线分界随选项长度改变，首部总长须为4 B的整数倍</text>
<rect x="155" y="574" width="896" height="48" fill="#eef1f3" stroke="#17212a" stroke-width="2" rx="0"/>
<text x="603.0" y="605.0" text-anchor="middle" font-size="21" font-weight="normal" fill="#17212a">TCP数据：起点为4×数据偏移 B；序号按数据字节编号</text>
<text x="590" y="657" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">数据偏移取5～15：首部20～60 B；窗口16 bit，无扩大选项时以B计</text>
<text x="590" y="693" text-anchor="middle" font-size="18" font-weight="normal" fill="#17212a">保留6 bit + 六个1 bit控制位；控制位由左到右为URG、ACK、PSH、RST、SYN、FIN</text>
<text x="590" y="729" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">检验和覆盖伪首部、TCP首部和数据；伪首部只参与计算，不随TCP段传送</text>
<text x="590" y="764" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">MSS只限制TCP数据长度；cwnd由发送端维护，不是首部中的窗口字段</text>
