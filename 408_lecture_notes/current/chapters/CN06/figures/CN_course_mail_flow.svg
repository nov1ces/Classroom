<svg xmlns="http://www.w3.org/2000/svg" width="960" height="405" viewBox="0 0 960 405"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#466c82"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#243743"><text x="25" y="35" font-size="18">邮件系统：提交、服务器间转送、用户读取</text><rect x="30" y="100" width="175" height="70" rx="5" fill="#e1edf1" stroke="#7395a5"/><text x="42" y="142.0" font-size="18">发件用户代理</text><rect x="270" y="100" width="175" height="70" rx="5" fill="#e1edf1" stroke="#7395a5"/><text x="282" y="142.0" font-size="18">发送邮件服务器</text><rect x="520" y="100" width="175" height="70" rx="5" fill="#e1edf1" stroke="#7395a5"/><text x="532" y="142.0" font-size="18">接收邮件服务器</text><rect x="770" y="100" width="175" height="70" rx="5" fill="#e1edf1" stroke="#7395a5"/><text x="782" y="142.0" font-size="18">收件用户代理</text><path d="M205,135 L270,135" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><path d="M445,135 L520,135" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><path d="M695,135 L770,135" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="206" y="100" font-size="15">SMTP</text><text x="446" y="100" font-size="15">SMTP</text><text x="697" y="100" font-size="15">POP3</text><text x="690" y="225" font-size="16">由用户代理发起读取请求</text><path d="M850,190 L605,190" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="40" y="285" font-size="18">邮件投递：用户代理提交 → 发送服务器排队 → 接收服务器邮箱</text><text x="40" y="330" font-size="17">邮件读取：收件用户代理向服务器发起请求；Web邮箱浏览器侧可用HTTP</text><text x="40" y="375" font-size="18">MIME描述邮件内容及编码，SMTP负责投递，POP3负责读取</text></g></svg>