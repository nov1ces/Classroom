<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#466C82" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" fill="#263945">
<text x="450.0" y="30" text-anchor="middle" font-size="23" fill="#263945">
<tspan x="450.0" dy="0">32K×16位存储器：16K×8位芯片的字位扩展</tspan>
</text>
<rect x="15" y="150" width="150" height="80" rx="7" fill="#DDEFF5" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="90.0" y="170.38000000000002" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="90.0" dy="0">CPU</tspan>
<tspan x="90.0" dy="26.099999999999998">A14…A0</tspan>
<tspan x="90.0" dy="26.099999999999998">D15…D0</tspan>
</text>
<rect x="220" y="140" width="150" height="95" rx="7" fill="#DFEFE6" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="295.0" y="168.97" text-anchor="middle" font-size="17" fill="#263945">
<tspan x="295.0" dy="0">片选译码</tspan>
<tspan x="295.0" dy="24.65">A14=0：组选0</tspan>
<tspan x="295.0" dy="24.65">A14=1：组选1</tspan>
</text>
<rect x="435" y="65" width="190" height="90" rx="7" fill="#DDEFF5" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="530.0" y="103.34" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="530.0" dy="0">组0／低8位</tspan>
<tspan x="530.0" dy="26.099999999999998">16K×8 → D7…D0</tspan>
</text>
<rect x="670" y="65" width="190" height="90" rx="7" fill="#DDEFF5" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="765.0" y="103.34" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="765.0" dy="0">组0／高8位</tspan>
<tspan x="765.0" dy="26.099999999999998">16K×8 → D15…D8</tspan>
</text>
<rect x="435" y="275" width="190" height="90" rx="7" fill="#DDEFF5" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="530.0" y="313.34000000000003" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="530.0" dy="0">组1／低8位</tspan>
<tspan x="530.0" dy="26.099999999999998">16K×8 → D7…D0</tspan>
</text>
<rect x="670" y="275" width="190" height="90" rx="7" fill="#DDEFF5" stroke="#8EA8B4" stroke-width="1.5"/>
<text x="765.0" y="313.34000000000003" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="765.0" dy="0">组1／高8位</tspan>
<tspan x="765.0" dy="26.099999999999998">16K×8 → D15…D8</tspan>
</text>
<path d="M165,175 L220,175" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="192.5" y="166.0" text-anchor="middle" font-size="16" fill="#263945">
<tspan x="192.5" dy="0">A14</tspan>
</text>
<path d="M370,165 H400 V110 H435" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400,110 V45 H765 V65" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370,210 H400 V320 H435" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400,320 V390 H765 V365" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="210" text-anchor="middle" font-size="20" fill="#263945">
<tspan x="650" dy="0">A13…A0并联到全部芯片</tspan>
</text>
<text x="650" y="240" text-anchor="middle" font-size="17" fill="#263945">
<tspan x="650" dy="0">组0：0000H～3FFFH；组1：4000H～7FFFH</tspan>
</text>
<text x="175" y="395" text-anchor="middle" font-size="18" fill="#263945">
<tspan x="175" dy="0">按字编址，每个字16位</tspan>
</text>
</g></svg>