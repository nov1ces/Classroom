<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#466c82"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#243743"><text x="25" y="28" font-size="18">经典三重复ACK：先有原ACK，再逐个数重复ACK</text><text x="115" y="65" font-size="18">发送方</text><text x="725" y="65" font-size="18">接收方</text><line x1="170" y1="80" x2="170" y2="625" stroke="#9aacb5"/><line x1="780" y1="80" x2="780" y2="625" stroke="#9aacb5"/><path d="M170,95 L780,125" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="260" y="90" font-size="18">seq=622，1 B</text><path d="M780,135 L170,165" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="270" y="178" font-size="17">ACK623：首次，推进确认</text><path d="M170,205 L780,235" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="260" y="200" font-size="18">seq=624，1 B（623丢失）</text><path d="M780,245 L170,275" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="270" y="288" font-size="17">ACK623：重复1</text><path d="M170,315 L780,345" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="260" y="310" font-size="18">seq=625，1 B</text><path d="M780,355 L170,385" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="270" y="398" font-size="17">ACK623：重复2</text><path d="M170,425 L780,455" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="260" y="420" font-size="18">seq=626，1 B</text><path d="M780,465 L170,495" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="270" y="508" font-size="17">ACK623：重复3，触发重传</text><path d="M170,580 L780,610" fill="none" stroke="#466c82" stroke-width="2" marker-end="url(#a)"/><text x="270" y="570" font-size="18">立即重传seq=623；补齐后累计ACK627</text></g><