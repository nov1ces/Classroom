<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#466C82"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#253F4B"><text x="24" y="30" font-size="18">递归从n到1：同时保留每个尚未返回的调用</text><text x="24" y="73" font-size="18">每层常数空间</text><text x="370" y="73" font-size="18">每层保留长度k的局部数组</text><rect x="80" y="90" width="130" height="34" rx="4" fill="#DDEFF5" stroke="#7B9AAA"/><text x="89" y="113.0" font-size="18">调用 n</text><rect x="410" y="90" width="230" height="34" rx="4" fill="#F9E8EC" stroke="#7B9AAA"/><text x="419" y="113.0" font-size="18">n 个单元</text><rect x="80" y="133" width="130" height="34" rx="4" fill="#DDEFF5" stroke="#7B9AAA"/><text x="89" y="156.0" font-size="18">调用 n−1</text><rect x="410" y="133" width="230" height="34" rx="4" fill="#F9E8EC" stroke="#7B9AAA"/><text x="419" y="156.0" font-size="18">n−1 个单元</text><rect x="80" y="176" width="130" height="34" rx="4" fill="#DDEFF5" stroke="#7B9AAA"/><text x="89" y="199.0" font-size="18">调用 ⋮</text><rect x="410" y="176" width="190" height="34" rx="4" fill="#F9E8EC" stroke="#7B9AAA"/><text x="419" y="199.0" font-size="18">⋮ 个单元</text><rect x="80" y="219" width="130" height="34" rx="4" fill="#DDEFF5" stroke="#7B9AAA"/><text x="89" y="242.0" font-size="18">调用 2</text><rect x="410" y="219" width="69" height="34" rx="4" fill="#F9E8EC" stroke="#7B9AAA"/><text x="419" y="242.0" font-size="18">2 个单元</text><rect x="80" y="262" width="130" height="34" rx="4" fill="#DDEFF5" stroke="#7B9AAA"/><text x="89" y="285.0" font-size="18">调用 1</text><rect x="410" y="262" width="62" height="34" rx="4" fill="#F9E8EC" stroke="#7B9AAA"/><text x="419" y="285.0" font-size="18">1 个单元</text><text x="24" y="350" font-size="18">峰值 Θ(n)</text><text x="370" y="350" font-size="18">n + (n−1) + ⋯ + 1 = Θ(n²)</text></g></svg>