<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#466C82"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#253F4B"><text x="24" y="30" font-size="18">带头结点链队列：删除最后一个数据结点</text><text x="24" y="93" font-size="18">删除前</text><rect x="160" y="65" width="110" height="48" rx="4" fill="#EEE3E9" stroke="#7B9AAA"/><text x="169" y="95.0" font-size="18">头结点</text><path d="M270,89 L350,89" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#a)"/><rect x="350" y="65" width="100" height="48" rx="4" fill="#DDEFF5" stroke="#7B9AAA"/><text x="359" y="95.0" font-size="18">x</text><path d="M450,89 L510,89" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#a)"/><text x="520" y="95" font-size="18">NULL</text><text x="150" y="145" font-size="18">front</text><text x="355" y="145" font-size="18">rear</text><text x="24" y="224" font-size="18">删除后</text><rect x="160" y="196" width="110" height="48" rx="4" fill="#EEE3E9" stroke="#7B9AAA"/><text x="169" y="226.0" font-size="18">头结点</text><path d="M270,220 L350,220" fill="none" stroke="#466C82" stroke-width="2" marker-end="url(#a)"/><text x="360" y="226" font-size="18">NULL</text><text x="140" y="285" font-size="18">front = rear</text><text x="24" y="340" font-size="18">先接回front-&gt;next，再让rear=front，最后释放数据结点</text></g></svg>