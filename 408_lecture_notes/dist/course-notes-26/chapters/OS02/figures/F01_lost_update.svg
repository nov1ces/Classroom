<text x="870" y="304" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">1</text>
<line x1="25" y1="373" x2="970" y2="373" stroke="#243746" stroke-width="2"/>
<text x="65" y="358" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">6</text>
<text x="300" y="358" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal"></text>
<text x="615" y="358" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">写 x=rB</text>
<text x="870" y="358" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">1</text>
</g>
