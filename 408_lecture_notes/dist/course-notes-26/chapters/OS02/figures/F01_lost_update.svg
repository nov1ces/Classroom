<text x="870" y="142" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">0</text>
<line x1="25" y1="211" x2="970" y2="211" stroke="#243746" stroke-width="2"/>
<text x="65" y="196" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">3</text>
<text x="300" y="196" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">rA=rA+1=1</text>
<text x="615" y="196" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal"></text>
<text x="870" y="196" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">0</text>
<line x1="25" y1="265" x2="970" y2="265" stroke="#243746" stroke-width="2"/>
<text x="65" y="250" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">4</text>
<text x="300" y="250" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal"></text>
<text x="615" y="250" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">rB=rB+1=1</text>
<text x="870" y="250" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">0</text>
<line x1="25" y1="319" x2="970" y2="319" stroke="#243746" stroke-width="2"/>
<text x="65" y="304" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">5</text>
