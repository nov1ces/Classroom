<text x="300" y="88" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">读 x：rA=0</text>
<text x="615" y="88" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal"></text>
<text x="870" y="88" text-anchor="middle" font-size="22" fill="#243746" font-weight="normal">0</text>
<line x1="25" y1="157" x2="970" y2="157" stroke="#243746" stroke-width="2"/>
