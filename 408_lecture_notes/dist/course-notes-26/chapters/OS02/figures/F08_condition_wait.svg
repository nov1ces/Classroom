<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#243746"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#243746" font-size="22">
<text x="200" y="35" text-anchor="middle" font-size="24" fill="#243746" font-weight="bold">等待者 T1</text>
<text x="760" y="35" text-anchor="middle" font-size="24" fill="#243746" font-weight="bold">改变条件者 T2</text>
<rect x="25" y="60" width="380" height="48" rx="4" fill="#f1f4f5" stroke="#243746" stroke-width="1.6"/>
<text x="215" y="91" text-anchor="middle" font-size="20" fill="#243746" font-weight="normal">持 m，检查条件为假</text>
<rect x="25" y="130" width="380" height="48" rx="4" fill="#f1f4f5" stroke="#243746" stroke-width="1.6"/>
<text x="215" y="161" text-anchor="middle" font-size="20" fill="#243746" font-weight="normal">wait(cv,m)：入队并释放 m</text>
<rect x="25" y="285" width="380" height="48" rx="4" fill="#f1f4f5" stroke="#243746" stroke-width="1.6"/>
<text x="215" y="316" text-anchor="middle" font-size="20" fill="#243746" font-weight="normal">重新取得 m，再检查条件</text>
<rect x="590" y="160" width="380" height="48" rx="4" fill="#f1f4f5" stroke="#243746" stroke-width="1.6"/>
<text x="780" y="191" text-anchor="middle" font-size="20" fill="#243746" font-weight="normal">取得 m，修改共享状态</text>
<rect x="590" y="225" width="380" height="48" rx="4" fill="#f1f4f5" stroke="#243746" stroke-width="1.6"/>
<text x="780" y="256" text-anchor="middle" font-size="20" fill="#243746" font-weight="normal">signal(cv)，随后释放 m</text>
<line x1="405" y1="155" x2="585" y2="183" stroke="#243746" stroke-width="2" marker-end="url(#arrow)"/>
<text x="505" y="124" text-anchor="middle" font-size="19" fill="#243746" font-weight="normal">让出锁</text>
<line x1="590" y1="250" x2="410" y2="306" stroke="#243746" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="277" text-anchor="middle" font-size="19" fill="#243746" font-weight="normal">通知后竞争锁</text>
<text x="500" y="356" text-anchor="middle" font-size="20" fill="#243746" font-weight="normal">本图采用 Mesa / POSIX 式通知语义：通知不把锁立即转交给等待者</text>
</g>
</svg>