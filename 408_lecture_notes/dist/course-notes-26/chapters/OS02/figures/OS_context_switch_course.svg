<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#53798D"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#253B49">
<text x="600" y="40" text-anchor="middle" font-size="27" font-weight="bold">x++ 执行过程中保存和恢复现场</text>
<rect x="30" y="75" width="535" height="300" rx="16" fill="#F4F8FA" stroke="#8EAAB8" stroke-width="2"/>
<rect x="30" y="75" width="535" height="58" rx="16" fill="#DDEFF4"/>
<text x="50" y="114" font-size="25" font-weight="bold">① P1 执行完指令3</text>
<text x="55" y="193" font-size="22">PC：指令4地址（下一条）</text>
<text x="55" y="250" font-size="22">IR：指令3；CPU 通用寄存器 R = 2</text>
<text x="55" y="307" font-size="22">P1 的内存：x = 1（尚未写回）</text>
<rect x="635" y="75" width="535" height="300" rx="16" fill="#F4F8FA" stroke="#8EAAB8" stroke-width="2"/>
<rect x="635" y="75" width="535" height="58" rx="16" fill="#DDEFF4"/>
<text x="655" y="114" font-size="25" font-weight="bold">② 切出 P1</text>
<text x="660" y="193" font-size="22">PCB(P1) 保存 PC、PSW 和寄存器</text>
<text x="660" y="250" font-size="22">其中 PC = 指令4地址，R = 2</text>
<text x="660" y="307" font-size="22">P1 的内存仍为 x = 1</text>
<rect x="30" y="455" width="535" height="300" rx="16" fill="#F4F8FA" stroke="#8EAAB8" stroke-width="2"/>
<rect x="30" y="455" width="535" height="58" rx="16" fill="#DDEFF4"/>
<text x="50" y="494" font-size="25" font-weight="bold">③ 另一个进程 P2 运行</text>
<text x="55" y="573" font-size="22">P2 使用自己的运行现场</text>
<text x="55" y="630" font-size="22">CPU 通用寄存器可被 P2 改为 250</text>
<text x="55" y="687" font-size="22">PCB(P1) 里保存的 R 仍为 2</text>
<rect x="635" y="455" width="535" height="300" rx="16" fill="#F4F8FA" stroke="#8EAAB8" stroke-width="2"/>
<rect x="635" y="455" width="535" height="58" rx="16" fill="#DDEFF4"/>
<text x="655" y="494" font-size="25" font-weight="bold">④ 恢复 P1 并执行指令4</text>
<text x="660" y="573" font-size="22">从 PCB(P1) 恢复 PC、PSW、R</text>
<text x="660" y="630" font-size="22">恢复时 PC = 指令4地址，R = 2</text>
<text x="660" y="687" font-size="22">指令4将 R 写回：P1 内存 x = 2</text>
<path d="M570,225 H625" stroke="#53798D" stroke-width="4" fill="none" marker-end="url(#arr)"/>
<path d="M900,382 V410 H300 V445" stroke="#53798D" stroke-width="4" fill="none" marker-end="url(#arr)"/>
<path d="M570,605 H625" stroke="#53798D" stroke-width="4" fill="none" marker-end="url(#arr)"/>
<text x="600" y="823" text-anchor="middle" font-size="20">PC 指向下一条指令；保存现场不等于把 P2 的寄存器值写入 P1</text>
</g></svg>