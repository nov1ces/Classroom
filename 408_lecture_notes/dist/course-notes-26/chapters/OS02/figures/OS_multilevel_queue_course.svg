<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#63879a"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="42" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#243947">按进程类型分别进入队列</text><text x="42" y="88" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#243947">最高优先级</text><text x="42" y="357" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#243947">最低优先级</text><path d="M45,130 L210,130" fill="none" stroke="#63879a" stroke-width="3"  marker-end="url(#a)"/><rect x="220" y="100" width="470" height="62" rx="8" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="455" y="127" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#243947">系统进程</text><text x="455" y="152" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#243947">如内存管理进程</text><path d="M700,130 L780,130" fill="none" stroke="#63879a" stroke-width="3"  marker-end="url(#a)"/><rect x="790" y="100" width="365" height="62" rx="8" fill="#f1f4f5" stroke="#668da0" stroke-width="2"/><text x="810" y="139" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#243947">队内：优先级调度   示例时间：50%</text><path d="M45,215 L210,215" fill="none" stroke="#63879a" stroke-width="3"  marker-end="url(#a)"/><rect x="220" y="185" width="470" height="62" rx="8" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="455" y="212" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#243947">交互式进程</text><text x="455" y="237" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#243947">如游戏、打字软件</text><path d="M700,215 L780,215" fill="none" stroke="#63879a" stroke-width="3"  marker-end="url(#a)"/><rect x="790" y="185" width="365" height="62" rx="8" fill="#f1f4f5" stroke="#668da0" stroke-width="2"/><text x="810" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#243947">队内：RR   示例时间：40%</text><path d="M45,300 L210,300" fill="none" stroke="#63879a" stroke-width="3"  marker-end="url(#a)"/><rect x="220" y="270" width="470" height="62" rx="8" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="455" y="297" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#243947">批处理进程</text><text x="455" y="322" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#243947">如模型训练、视频渲染</text><path d="M700,300 L780,300" fill="none" stroke="#63879a" stroke-width="3"  marker-end="url(#a)"/><rect x="790" y="270" width="365" height="62" rx="8" fill="#f1f4f5" stroke="#668da0" stroke-width="2"/><text x="810" y="309" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#243947">队内：FCFS   示例时间：10%</text><text x="35" y="385" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#243947">队列间另选一种规则：固定优先级，或按 50% / 40% / 10% 分配CPU时间。</text><text x="35" y="420" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#243947">固定优先级：高优先级队列为空，低优先级队列才能被调度。</text></svg>