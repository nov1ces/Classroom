<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#63879a"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="45" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#243947">链式组织：同一状态的 PCB 链接成队列</text><rect x="35" y="90" width="250" height="65" rx="6" fill="#dceef4" stroke="#668da0" stroke-width="2"/><text x="160" y="132" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#243947">执行指针</text><path d="M290,123 L390,123" fill="none" stroke="#63879a" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="90" width="160" height="65" rx="6" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="485" y="132" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#243947">PCB2</text><rect x="35" y="195" width="250" height="65" rx="6" fill="#dceef4" stroke="#668da0" stroke-width="2"/><text x="160" y="237" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#243947">就绪队列指针</text><path d="M290,228 L390,228" fill="none" stroke="#63879a" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="195" width="160" height="65" rx="6" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="485" y="237" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#243947">PCB5</text><path d="M570,228 L620,228" fill="none" stroke="#63879a" stroke-width="3" marker-end="url(#arrow)"/><rect x="635" y="195" width="160" height="65" rx="6" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="715" y="237" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#243947">PCB1</text><path d="M800,228 L850,228" fill="none" stroke="#63879a" stroke-width="3" marker-end="url(#arrow)"/><rect x="865" y="195" width="160" height="65" rx="6" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="945" y="237" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#243947">PCB4</text><rect x="35" y="300" width="250" height="65" rx="6" fill="#dceef4" stroke="#668da0" stroke-width="2"/><text x="160" y="342" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#243947">阻塞队列指针</text><path d="M290,333 L390,333" fill="none" stroke="#63879a" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="300" width="160" height="65" rx="6" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="485" y="342" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#243947">PCB3</text><path d="M570,333 L620,333" fill="none" stroke="#63879a" stroke-width="3" marker-end="url(#arrow)"/><rect x="635" y="300" width="160" height="65" rx="6" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="715" y="342" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#243947">PCB7</text><path d="M800,333 L850,333" fill="none" stroke="#63879a" stroke-width="3" marker-end="url(#arrow)"/><rect x="865" y="300" width="160" height="65" rx="6" fill="#e3f1f4" stroke="#668da0" stroke-width="2"/><text x="945" y="342" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#243947">PCB6</text><text x="35" y="420" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#243947">单CPU在同一时刻最多一个进程运行；就绪队列顺序由调度规则决定。</text><text x="35" y="456" font-family="Noto Sans CJK SC,sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#243947">阻塞进程可按等待事件分别组织为多个队列。</text></svg>