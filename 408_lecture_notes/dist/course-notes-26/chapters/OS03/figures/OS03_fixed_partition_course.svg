<text x="558" y="435" font-size="16">30</text>
<text x="558" y="555" font-size="16">42</text>
<text x="25" y="642" font-size="18">每个表项记录分区大小、起始地址和分配状态；分区内的未用空间为内部碎片。</text>
</g></svg>