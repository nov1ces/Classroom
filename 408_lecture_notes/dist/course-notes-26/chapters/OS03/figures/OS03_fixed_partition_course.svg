<text x="558" y="235" font-size="16">10</text>
<rect x="600" y="250" width="330" height="40" fill="#dcefe0" stroke="#7897a5"/>
<text x="765" y="276.0" text-anchor="middle" font-size="18">分区3  4 MB</text>
<text x="558" y="255" font-size="16">12</text>
<rect x="600" y="290" width="330" height="60" fill="#dcefe0" stroke="#7897a5"/>
<text x="765" y="326.0" text-anchor="middle" font-size="18">分区4  6 MB</text>
<text x="558" y="295" font-size="16">16</text>
<rect x="600" y="350" width="330" height="80" fill="#dcefe0" stroke="#7897a5"/>
