<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660">
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC,sans-serif" fill="#20343f">
<text x="25" y="35" font-size="25" font-weight="bold">王道课件：固定分区可等大，也可不等大</text>
<text x="25" y="65" font-size="19">各分区一次只装入一道作业；两列分别是独立内存示意，单位MB。</text>
<text x="110" y="108" font-size="21" font-weight="bold">等大：四个10 MB分区</text>
<rect x="110" y="130" width="330" height="80" fill="#f5d7b4" stroke="#7897a5"/>
<text x="275" y="176.0" text-anchor="middle" font-size="18">操作系统 8 MB</text>
<text x="68" y="135" font-size="16">0</text>
<rect x="110" y="210" width="330" height="100" fill="#dcefe0" stroke="#7897a5"/>
<text x="275" y="266.0" text-anchor="middle" font-size="18">分区1  10 MB</text>
<text x="68" y="215" font-size="16">8</text>
<rect x="110" y="310" width="330" height="100" fill="#dcefe0" stroke="#7897a5"/>
<text x="275" y="366.0" text-anchor="middle" font-size="18">分区2  10 MB</text>
<text x="68" y="315" font-size="16">18</text>
<rect x="110" y="410" width="330" height="100" fill="#dcefe0" stroke="#7897a5"/>
<text x="275" y="466.0" text-anchor="middle" font-size="18">分区3  10 MB</text>
<text x="68" y="415" font-size="16">28</text>
<rect x="110" y="510" width="330" height="100" fill="#dcefe0" stroke="#7897a5"/>
