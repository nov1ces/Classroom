<text x="68" y="515" font-size="16">38</text>
<text x="68" y="615" font-size="16">48</text>
<text x="600" y="108" font-size="21" font-weight="bold">不等大：2、2、4、6、8、12 MB</text>
<rect x="600" y="130" width="330" height="80" fill="#f5d7b4" stroke="#7897a5"/>
<text x="765" y="176.0" text-anchor="middle" font-size="18">操作系统 8 MB</text>
<text x="558" y="135" font-size="16">0</text>
<rect x="600" y="210" width="330" height="20" fill="#dcefe0" stroke="#7897a5"/>
<text x="765" y="226.0" text-anchor="middle" font-size="18">分区1  2 MB</text>
<text x="558" y="215" font-size="16">8</text>
<rect x="600" y="230" width="330" height="20" fill="#dcefe0" stroke="#7897a5"/>
