<rect x="230" y="208" width="46" height="32" rx="3" fill="#dcefe4" stroke="#536f7e"/>
<text x="253.0" y="231" text-anchor="middle" font-size="18">M1</text>
<rect x="276" y="208" width="138" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
<text x="345.0" y="231" text-anchor="middle" font-size="18">C</text>
<rect x="460" y="208" width="46" height="32" rx="3" fill="#dcefe4" stroke="#536f7e"/>
<text x="483.0" y="231" text-anchor="middle" font-size="18">M2</text>
<rect x="506" y="208" width="138" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
<text x="575.0" y="231" text-anchor="middle" font-size="18">C</text>
<rect x="690" y="208" width="46" height="32" rx="3" fill="#dcefe4" stroke="#536f7e"/>
<text x="713.0" y="231" text-anchor="middle" font-size="18">M1</text>
<rect x="736" y="208" width="138" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
<text x="805.0" y="231" text-anchor="middle" font-size="18">C</text>
<line x1="230" y1="255" x2="230" y2="263" stroke="#536f7e"/>
<text x="230" y="286" text-anchor="middle" font-size="20">0</text>
<line x1="460" y1="255" x2="460" y2="263" stroke="#536f7e"/>
<text x="460" y="286" text-anchor="middle" font-size="20">5</text>
<line x1="690" y1="255" x2="690" y2="263" stroke="#536f7e"/>
<text x="690" y="286" text-anchor="middle" font-size="20">10</text>
<line x1="920" y1="255" x2="920" y2="263" stroke="#536f7e"/>
<text x="920" y="286" text-anchor="middle" font-size="20">15</text>
<text x="40" y="318" font-size="19">M1、M2分别表示从缓冲区1、2复制；设备可连续填入。</text>
<text x="40" y="370" font-size="22" font-weight="bold">T &lt; M+C：示意取 T=2，M=1，C=3；周期 M+C=4</text>
<text x="215" y="418" text-anchor="end" font-size="20">设备 → 缓冲区2</text>
<line x1="230" y1="425" x2="1058" y2="425" stroke="#aab6bf" stroke-width="1"/>
<rect x="230" y="393" width="92" height="32" rx="3" fill="#dcecf4" stroke="#536f7e"/>
<text x="276.0" y="416" text-anchor="middle" font-size="18">T</text>
<rect x="460" y="393" width="92" height="32" rx="3" fill="#dcecf4" stroke="#536f7e"/>
<text x="506.0" y="416" text-anchor="middle" font-size="18">T</text>
<rect x="828" y="393" width="92" height="32" rx="3" fill="#dcecf4" stroke="#536f7e"/>
<text x="874.0" y="416" text-anchor="middle" font-size="18">T</text>
