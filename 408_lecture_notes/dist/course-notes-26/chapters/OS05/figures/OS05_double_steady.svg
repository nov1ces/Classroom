<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="white"/>
<g fill="#253d4a" font-family="Noto Sans CJK SC, sans-serif" font-size="23">
<text x="40" y="34" font-size="25" font-weight="bold">双缓冲：工作区初始为空，缓冲区1满、缓冲区2空</text>
<text x="40" y="85" font-size="22" font-weight="bold">T &gt; M+C：示意取 T=5，M=1，C=3；周期 T=5</text>
<text x="215" y="133" text-anchor="end" font-size="20">设备 → 缓冲区2</text>
<line x1="230" y1="140" x2="1058" y2="140" stroke="#aab6bf" stroke-width="1"/>
<rect x="230" y="108" width="230" height="32" rx="3" fill="#dcecf4" stroke="#536f7e"/>
<text x="345.0" y="131" text-anchor="middle" font-size="18">T</text>
<rect x="690" y="108" width="230" height="32" rx="3" fill="#dcecf4" stroke="#536f7e"/>
<text x="805.0" y="131" text-anchor="middle" font-size="18">T</text>
<text x="215" y="183" text-anchor="end" font-size="20">设备 → 缓冲区1</text>
<line x1="230" y1="190" x2="1058" y2="190" stroke="#aab6bf" stroke-width="1"/>
<rect x="460" y="158" width="230" height="32" rx="3" fill="#dcecf4" stroke="#536f7e"/>
<text x="575.0" y="181" text-anchor="middle" font-size="18">T</text>
