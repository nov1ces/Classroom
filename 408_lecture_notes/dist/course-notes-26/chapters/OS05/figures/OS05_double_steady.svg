<rect x="322" y="443" width="92" height="32" rx="3" fill="#dcecf4" stroke="#536f7e"/>
<text x="368.0" y="466" text-anchor="middle" font-size="18">T</text>
<rect x="644" y="443" width="92" height="32" rx="3" fill="#dcecf4" stroke="#536f7e"/>
<text x="690.0" y="466" text-anchor="middle" font-size="18">T</text>
<text x="215" y="518" text-anchor="end" font-size="20">复制M / CPU处理C</text>
<line x1="230" y1="525" x2="1058" y2="525" stroke="#aab6bf" stroke-width="1"/>
<rect x="230" y="493" width="46" height="32" rx="3" fill="#dcefe4" stroke="#536f7e"/>
<text x="253.0" y="516" text-anchor="middle" font-size="18">M1</text>
<rect x="276" y="493" width="138" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
<text x="345.0" y="516" text-anchor="middle" font-size="18">C</text>
<rect x="414" y="493" width="46" height="32" rx="3" fill="#dcefe4" stroke="#536f7e"/>
<text x="437.0" y="516" text-anchor="middle" font-size="18">M2</text>
<rect x="460" y="493" width="138" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
<text x="529.0" y="516" text-anchor="middle" font-size="18">C</text>
<rect x="598" y="493" width="46" height="32" rx="3" fill="#dcefe4" stroke="#536f7e"/>
<text x="621.0" y="516" text-anchor="middle" font-size="18">M1</text>
<rect x="644" y="493" width="138" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
<text x="713.0" y="516" text-anchor="middle" font-size="18">C</text>
<rect x="782" y="493" width="46" height="32" rx="3" fill="#dcefe4" stroke="#536f7e"/>
<text x="805.0" y="516" text-anchor="middle" font-size="18">M2</text>
<rect x="828" y="493" width="138" height="32" rx="3" fill="#fff1cd" stroke="#536f7e"/>
<text x="897.0" y="516" text-anchor="middle" font-size="18">C</text>
<line x1="230" y1="540" x2="230" y2="548" stroke="#536f7e"/>
<text x="230" y="571" text-anchor="middle" font-size="20">0</text>
<line x1="414" y1="540" x2="414" y2="548" stroke="#536f7e"/>
<text x="414" y="571" text-anchor="middle" font-size="20">4</text>
<line x1="598" y1="540" x2="598" y2="548" stroke="#536f7e"/>
<text x="598" y="571" text-anchor="middle" font-size="20">8</text>
<line x1="782" y1="540" x2="782" y2="548" stroke="#536f7e"/>
<text x="782" y="571" text-anchor="middle" font-size="20">12</text>
<line x1="966" y1="540" x2="966" y2="548" stroke="#536f7e"/>
<text x="966" y="571" text-anchor="middle" font-size="20">16</text>
<text x="40" y="603" font-size="19">设备在4–5和7–9等待空缓冲区；复制与CPU处理依次进行。</text>
</g></svg>