<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#425f72"/></marker></defs>
<rect width="1240" height="680" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#223644">
<text x="35" y="42" font-size="30" fill="#223644" text-anchor="start">通道执行主存中的通道程序</text>
<rect x="40" y="250" width="170" height="130" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="125.0" y="324.8" text-anchor="middle" font-size="28">CPU</text>
<rect x="330" y="70" width="250" height="130" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="455.0" y="128.79" text-anchor="middle" font-size="23">主存</text>
<text x="455.0" y="157.31" text-anchor="middle" font-size="23">通道程序（任务清单）</text>
<rect x="330" y="430" width="250" height="120" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="455.0" y="483.79" text-anchor="middle" font-size="23">主存</text>
<text x="455.0" y="512.31" text-anchor="middle" font-size="23">数据缓冲区</text>
<rect x="700" y="235" width="210" height="165" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="805.0" y="297.03000000000003" text-anchor="middle" font-size="23">I/O 通道</text>
<text x="805.0" y="325.55" text-anchor="middle" font-size="23">通道程序首地址</text>
<text x="805.0" y="354.07000000000005" text-anchor="middle" font-size="23">控制连接的设备</text>
<rect x="1010" y="75" width="170" height="90" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="1095.0" y="128.4" text-anchor="middle" font-size="24">I/O设备 1</text>
<rect x="1010" y="250" width="170" height="90" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="1095.0" y="303.4" text-anchor="middle" font-size="24">I/O设备 2</text>
<rect x="1010" y="425" width="170" height="90" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="1095.0" y="478.4" text-anchor="middle" font-size="24">I/O设备 3</text>
<path d="M210 285 H698" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="250" y="275" font-size="20" fill="#223644" text-anchor="start">① CPU 发 I/O 指令及通道程序地址</text>
<path d="M582 145 H640 V245 H698" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="585" y="125" font-size="20" fill="#223644" text-anchor="start">② 从主存取指令</text>
<path d="M760 400 V465 H583" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M583 510 H800 V402" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600" y="455" font-size="20" fill="#223644" text-anchor="start">数据块传送</text>
<path d="M910 260 H960 V120 H1008" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M910 285 H960 V295 H1008" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M910 310 H960 V470 H1008" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M700 345 H212" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="260" y="373" font-size="20" fill="#223644" text-anchor="start">③ 任务结束后向 CPU 发中断</text>
<text x="50" y="605" font-size="23" fill="#223644" text-anchor="start">通道执行专用 I/O 指令；通道程序和数据均位于主存。</text>
<text x="50" y="645" font-size="23" fill="#223644" text-anchor="start">图中三台设备是接口示意；各设备请求由通道程序组织。</text>
</g></svg>