<text x="610" y="86" font-size="20">磁臂共同移动方向</text>
<text x="815" y="160" font-size="22">每个盘面对应一个磁头</text>
<text x="815" y="200" font-size="22">磁头连接同一磁臂</text>
<text x="815" y="238" font-size="22">因而共同进退</text>
<text x="815" y="345" font-size="22">同半径磁道形成柱面</text>
<text x="815" y="382" font-size="22">金色磁道标出一个柱面</text>
<text x="50" y="585" font-size="22">一个盘片可以有两个盘面；图中示出0～3号四个盘面。</text>
<text x="50" y="620" font-size="22">按柱面号移动磁臂，选择盘面对应磁头，等待目标扇区转至磁头下。</text>
<text x="50" y="655" font-size="22">教学模型按（柱面号，盘面号，扇区号）定位；具体设备可能对外提供LBA。</text>
