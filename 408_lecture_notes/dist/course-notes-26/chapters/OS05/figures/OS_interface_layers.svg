<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#476b80"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" font-size="25" fill="#243b49">
<text x="25" y="38" font-size="30" font-weight="bold">应用程序接口与标准驱动接口</text>
<text x="25" y="85" font-weight="bold">用户层 I/O 软件</text>
<rect x="25" y="105" width="350" height="156" rx="6" fill="#e3f1e8" stroke="#7d9cab" stroke-width="2"/>
<text x="200" y="139" text-anchor="middle" font-weight="bold">字符设备接口</text>
<text x="43" y="177" font-size="22">get / put</text>
<text x="43" y="209" font-size="22">例：键盘、打印机</text>
<text x="43" y="241" font-size="22">按字符处理</text>
<path d="M200 264 L600 310" fill="none" stroke="#476b80" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="415" y="105" width="350" height="156" rx="6" fill="#f6e8f0" stroke="#7d9cab" stroke-width="2"/>
<text x="590" y="139" text-anchor="middle" font-weight="bold">块设备接口</text>
<text x="433" y="177" font-size="22">read / write</text>
<text x="433" y="209" font-size="22">seek：改变读写位置</text>
<text x="433" y="241" font-size="22">例：磁盘</text>
<path d="M590 264 L600 310" fill="none" stroke="#476b80" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="805" y="105" width="350" height="156" rx="6" fill="#fff1c9" stroke="#7d9cab" stroke-width="2"/>
<text x="980" y="139" text-anchor="middle" font-weight="bold">网络设备接口</text>
<text x="823" y="177" font-size="22">socket：指定协议</text>
<text x="823" y="209" font-size="22">bind：绑定本地端口</text>
<text x="823" y="241" font-size="22">connect / read / write</text>
<path d="M980 264 L600 310" fill="none" stroke="#476b80" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="305" y="315" width="590" height="68" rx="6" fill="#eef4f7" stroke="#7d9cab" stroke-width="2"/>
<text x="600" y="358" text-anchor="middle" font-weight="bold">设备独立软件</text>
<path d="M600 383 L600 420" fill="none" stroke="#476b80" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="305" y="425" width="590" height="67" rx="6" fill="#e3f1e8" stroke="#7d9cab" stroke-width="2"/>
<text x="600" y="468" text-anchor="middle" font-weight="bold">统一的设备驱动程序接口</text>
<text x="600" y="526" text-anchor="middle" font-size="22">例如：相同 read(p1, p2, p3) 接口约定</text>
<path d="M450 540 L260 590" fill="none" stroke="#476b80" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M750 540 L940 590" fill="none" stroke="#476b80" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="100" y="595" width="320" height="68" rx="6" fill="#eef4f7" stroke="#7d9cab" stroke-width="2"/>
<rect x="780" y="595" width="320" height="68" rx="6" fill="#eef4f7" stroke="#7d9cab" stroke-width="2"/>
<text x="260" y="638" text-anchor="middle">设备驱动程序 A</text>
<text x="940" y="638" text-anchor="middle">设备驱动程序 B</text>
<path d="M260 665 L260 713" fill="none" stroke="#476b80" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M940 665 L940 713" fill="none" stroke="#476b80" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="100" y="717" width="320" height="70" rx="6" fill="#fff1c9" stroke="#7d9cab" stroke-width="2"/>
<rect x="780" y="717" width="320" height="70" rx="6" fill="#fff1c9" stroke="#7d9cab" stroke-width="2"/>
<text x="260" y="759" text-anchor="middle" font-size="22">罗技设备（课件示例）</text>
<text x="940" y="759" text-anchor="middle" font-size="22">雷蛇设备（课件示例）</text>
<text x="600" y="824" text-anchor="middle" font-size="22">中断处理程序响应设备完成或异常；厂商按接口实现对应驱动。</text>
</g></svg>