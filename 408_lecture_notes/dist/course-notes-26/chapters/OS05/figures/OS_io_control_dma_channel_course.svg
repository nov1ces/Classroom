<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#425f72"/></marker></defs>
<rect width="1240" height="640" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#223644">
<rect x="25" y="35" width="580" height="585" rx="12" fill="#fafcfd" stroke="#b1c4cc" stroke-width="2"/>
<text x="45" y="75" font-size="28" fill="#223644" text-anchor="start">③ DMA 控制</text>
