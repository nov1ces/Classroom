<text x="315.0" y="245.9" text-anchor="middle" font-size="24">DMA 启动并执行传送</text>
<path d="M315 170 V203" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="85" y="305" width="460" height="65" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="315.0" y="345.9" text-anchor="middle" font-size="24">设备 ⇄ 内存（DMA）</text>
<path d="M315 270 V303" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="85" y="405" width="460" height="65" rx="7" fill="#e6f2e9" stroke="#7796a5" stroke-width="2"/>
<text x="315.0" y="445.9" text-anchor="middle" font-size="24">整块完成：中断 CPU</text>
<path d="M315 370 V403" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="80" y="555" font-size="21" fill="#223644" text-anchor="start">CPU 介入启动、异常和结束处理</text>
<rect x="635" y="35" width="580" height="585" rx="12" fill="#fafcfd" stroke="#b1c4cc" stroke-width="2"/>
<text x="655" y="75" font-size="28" fill="#223644" text-anchor="start">④ 通道控制</text>
<rect x="695" y="105" width="460" height="65" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="925.0" y="145.9" text-anchor="middle" font-size="24">CPU 给出通道程序地址</text>
<rect x="695" y="205" width="460" height="65" rx="7" fill="#e6f2e9" stroke="#7796a5" stroke-width="2"/>
<text x="925.0" y="245.9" text-anchor="middle" font-size="24">通道取指并自主执行</text>
<path d="M925 170 V203" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="695" y="305" width="460" height="65" rx="7" fill="#e1eef3" stroke="#7796a5" stroke-width="2"/>
<text x="925.0" y="345.9" text-anchor="middle" font-size="24">设备 ⇄ 内存（通道）</text>
<path d="M925 270 V303" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="695" y="405" width="460" height="65" rx="7" fill="#e6f2e9" stroke="#7796a5" stroke-width="2"/>
<text x="925.0" y="445.9" text-anchor="middle" font-size="24">整组任务结束：中断 CPU</text>
<path d="M925 370 V403" fill="none" stroke="#425f72" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="690" y="555" font-size="21" fill="#223644" text-anchor="start">通道程序位于内存，组织一组数据块</text>
</g></svg>