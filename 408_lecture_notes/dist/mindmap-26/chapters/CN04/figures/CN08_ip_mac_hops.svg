<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17212a"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#17212a" stroke-linejoin="round">
<text x="490" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#17212a">普通IP转发，无NAT</text>
<rect x="65" y="85" width="130" height="65" fill="white" stroke="#17212a" stroke-width="2" rx="0"/>
<text x="130.0" y="124.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">主机A</text>
<rect x="410" y="85" width="160" height="65" fill="white" stroke="#17212a" stroke-width="2" rx="0"/>
<text x="490.0" y="124.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">路由器R</text>
<rect x="785" y="85" width="130" height="65" fill="white" stroke="#17212a" stroke-width="2" rx="0"/>
<text x="850.0" y="124.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">主机B</text>
<line x1="195" y1="118" x2="410" y2="118" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="570" y1="118" x2="785" y2="118" stroke="#17212a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="305" y="185" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">A的MAC → R入口MAC</text>
<text x="675" y="185" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">R出口MAC → B的MAC</text>
<rect x="110" y="225" width="760" height="55" fill="#eef1f3" stroke="#17212a" stroke-width="2" rx="0"/>
<text x="490.0" y="259.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#17212a">两跳IP地址：源=A的IP，目的=B的IP</text>
<text x="490" y="330" text-anchor="middle" font-size="20" font-weight="normal" fill="#17212a">ARP查询当前下一跳；交换机转发同一帧不替换源MAC</text>
</g></svg>