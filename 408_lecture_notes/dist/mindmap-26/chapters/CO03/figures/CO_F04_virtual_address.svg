<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500" y="30" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#111">页大小 4 KiB：页内偏移12位保持不变</text>
<rect x="30" y="60" width="580" height="55" fill="#e9f0f3" stroke="#333" stroke-width="2"/>
