<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500" y="30" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#111">异步全互锁：请求和应答的撤销也要相互确认</text>
<text x="95" y="125" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#111">请求</text>
<text x="95" y="215" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#111">应答</text>
<path d="M170,145 L240,145 L240,85 L580,85 L580,145 L940,145" fill="none" stroke="#333" stroke-width="2"/>
<path d="M170,235 L410,235 L410,175 L770,175 L770,235 L940,235" fill="none" stroke="#333" stroke-width="2"/>
<line x1="240" y1="85" x2="240" y2="280" stroke="#333" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="410" y1="175" x2="410" y2="280" stroke="#333" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="580" y1="145" x2="580" y2="280" stroke="#333" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="770" y1="235" x2="770" y2="280" stroke="#333" stroke-width="2" stroke-dasharray="7 5"/>
<text x="240" y="315" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#111">置请求</text>
<text x="410" y="315" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#111">置应答</text>
<text x="580" y="315" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#111">撤请求</text>
<text x="770" y="315" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#111">撤应答</text>
<line x1="245" y1="80" x2="405" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="415" y1="175" x2="575" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="585" y1="145" x2="765" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>