<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#243746"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#243746" font-size="22">
<rect x="40" y="90" width="300" height="110" rx="4" fill="#f1f4f5" stroke="#243746" stroke-width="1.6"/>
<text x="190" y="126" text-anchor="middle" font-size="25" fill="#243746" font-weight="bold">消费者 C</text>
<text x="190" y="165" text-anchor="middle" font-size="19" fill="#243746" font-weight="normal">已持有 mutex；阻塞于 full</text>
<rect x="660" y="90" width="300" height="110" rx="4" fill="#f1f4f5" stroke="#243746" stroke-width="1.6"/>
<text x="810" y="126" text-anchor="middle" font-size="25" fill="#243746" font-weight="bold">生产者 P</text>
<text x="810" y="165" text-anchor="middle" font-size="21" fill="#243746" font-weight="normal">阻塞于 mutex</text>
<line x1="340" y1="105" x2="655" y2="105" stroke="#243746" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="80" text-anchor="middle" font-size="21" fill="#243746" font-weight="normal">C 等 P 放入产品</text>
<line x1="660" y1="190" x2="345" y2="190" stroke="#243746" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="231" text-anchor="middle" font-size="21" fill="#243746" font-weight="normal">P 等 C 释放 mutex</text>
<text x="500" y="275" text-anchor="middle" font-size="20" fill="#243746" font-weight="normal">初始缓冲区为空；错误顺序：先 P(mutex)，再等待产品</text>
</g>
</svg>