<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="295" viewBox="0 0 1000 295">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500" y="30" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#111">外部中断：请求产生 ≠ 立即执行服务程序</text>
<rect x="25" y="100" width="180" height="70" fill="white" stroke="#333" stroke-width="2"/>
<text x="115.0" y="142.35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">当前指令</text>
<rect x="205" y="100" width="180" height="70" fill="#e9f0f3" stroke="#333" stroke-width="2"/>
<text x="295.0" y="142.35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">硬件响应</text>
<rect x="385" y="100" width="180" height="70" fill="#e9f0f3" stroke="#333" stroke-width="2"/>
<text x="475.0" y="142.35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">入口保护</text>
<rect x="565" y="100" width="190" height="70" fill="white" stroke="#333" stroke-width="2"/>
<text x="660.0" y="142.35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">事件处理</text>
<rect x="755" y="100" width="220" height="70" fill="white" stroke="#333" stroke-width="2"/>
<text x="865.0" y="142.35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">恢复并返回</text>
<line x1="90" y1="65" x2="90" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="90" y="57" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#111">请求到达</text>
<line x1="205" y1="65" x2="205" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="285" y="57" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#111">指令边界接受请求</text>
<text x="500" y="220" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" fill="#111">硬件：保存断点/规定状态、确定入口；软件：保存通用寄存器等</text>
<text x="500" y="263" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#111">处理后可回原进程；是否调度其他进程由系统另行决定</text>
</svg>