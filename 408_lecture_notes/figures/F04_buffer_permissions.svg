<text x="382" y="151" text-anchor="middle" font-size="18" fill="#243746" font-weight="normal">槽0</text>
<rect x="424" y="111" width="65" height="65" rx="4" fill="white" stroke="#243746" stroke-width="1.6"/>
<text x="456" y="151" text-anchor="middle" font-size="18" fill="#243746" font-weight="normal">槽1</text>
<rect x="498" y="111" width="65" height="65" rx="4" fill="white" stroke="#243746" stroke-width="1.6"/>
<text x="530" y="151" text-anchor="middle" font-size="18" fill="#243746" font-weight="normal">槽2</text>
