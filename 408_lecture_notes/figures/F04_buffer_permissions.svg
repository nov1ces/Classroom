<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#243746"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#243746" font-size="22">
<rect x="35" y="92" width="235" height="125" rx="4" fill="#f1f4f5" stroke="#243746" stroke-width="1.6"/>
<text x="152" y="130" text-anchor="middle" font-size="25" fill="#243746" font-weight="bold">生产者</text>
<text x="152" y="172" text-anchor="middle" font-size="20" fill="#243746" font-weight="normal">P(empty) → 放入</text>
