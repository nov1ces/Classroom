<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" fill="#333"/></marker></defs>
<rect width="960" height="430" fill="white"/>
<text x="480.0" y="31" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="bold" fill="#111">三种基本状态：等待事件与等待CPU分别判断</text>
<rect x="100" y="130" width="220" height="80" rx="4" fill="#f2f3f4" stroke="#333" stroke-width="2"/>
<text x="210.0" y="163.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">就绪</text>
<text x="210.0" y="191.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">只缺CPU</text>
<rect x="640" y="130" width="220" height="80" rx="4" fill="#f2f3f4" stroke="#333" stroke-width="2"/>
<text x="750.0" y="163.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">运行</text>
<text x="750.0" y="191.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">正在CPU上执行</text>
<rect x="370" y="315" width="220" height="75" rx="4" fill="#fff5dc" stroke="#333" stroke-width="2"/>
<text x="480.0" y="345.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">阻塞</text>
<text x="480.0" y="373.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="normal" fill="#111">等待事件</text>
<line x1="320" y1="150" x2="640" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="132" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">调度分派</text>
<path d="M640,142 C550,55 410,55 320,142" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="61" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#111">抢占、时间片到或主动让出</text>
<line x1="710" y1="210" x2="550" y2="315" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="735" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">等待I/O、资源或事件</text>
<line x1="400" y1="315" x2="250" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
<text x="220" y="286" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#111">事件满足后唤醒</text>
</svg>